name: Sync release to AtomGit

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ATOMGIT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to synchronize (for example v0.11.3)
        required: true
        type: string
  release:
    types: [published, edited]

permissions:
  # Listing the still-draft release that the build jobs are populating needs
  # push access; a read-only token never sees it.
  contents: write

# Serialize tags too, so a historical backfill cannot race latest promotion.
# Never interrupt an upload to start a newer run.
concurrency:
  group: atomgit-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Uploading every asset and then re-downloading it to verify runs at
    # AtomGit's ~100 KB/s: a release with a 120 MB AppImage needs well over an
    # hour (#694). Keep headroom below GitHub's 360-minute hard limit.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Synchronize release notes and every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPOSITORY: ${{ vars.ATOMGIT_REPOSITORY || 'poco-ai/Agentero' }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/sync-atomgit-release.mjs
